[build]
  command = "npm run build:web"
  publish = "dist"
  functions = "netlify/functions"

# Proxy para la API de LeagueRepublic (evita CORS en web).
# /api/getSeasonsForLeague/815179436.json -> https://api.leaguerepublic.com/json/getSeasonsForLeague/815179436.json
[[redirects]]
  from = "/api/*"
  to = "https://api.leaguerepublic.com/json/:splat"
  status = 200
  force = true

# Endpoint unificado de noticias: /news-article -> función serverless.
# En Render, el servidor Express maneja esta ruta directamente.
[[redirects]]
  from = "/news-article"
  to = "/.netlify/functions/news-article"
  status = 200
  force = true

# SPA: todas las rutas sirven index.html (expo-router client routing)
# Excepto las funciones serverless de Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Desactivar el Netlify Drawer / badge "Powered by Netlify".
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/index.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob:; connect-src 'self' https:; frame-ancestors 'self';"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
